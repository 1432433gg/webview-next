services:
  webview:
    build:
      context: ..
    init: true
    shm_size: 256m
    security_opt:
      - seccomp=./seccomp_profile.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8050/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
